[package]
name = "t3-desktop-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-channel = "2.5.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e", features = [
  "font-kit",
] }
hex = "0.4.3"
hmac = "0.13.0"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "process",
  "time",
  "sync",
  "io-util",
  "macros",
] }
tokio-tungstenite = "0.30.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
