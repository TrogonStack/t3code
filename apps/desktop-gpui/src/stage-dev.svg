      <stop offset="0.85" stop-color="#fff" stop-opacity="0.01"/>
      <stop offset="0.92" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mask" maskUnits="userSpaceOnUse" x="0" y="0" width="360" height="96">
      <rect width="360" height="96" fill="url(#fade)"/>
    </mask>
  </defs>
